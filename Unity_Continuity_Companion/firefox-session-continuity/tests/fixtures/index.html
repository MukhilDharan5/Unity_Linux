<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Session Continuity fixtures</title><style>body{font:18px system-ui;margin:0;padding:30px;color:#173b36;background:#f7faf7}main{max-width:900px;margin:auto}section.chapter{height:500px;border-top:1px solid #b5cabc;padding:20px}video{width:300px}#nested{height:220px;width:400px;overflow:auto;border:3px solid teal}#nested-content{height:1800px;width:1000px}label{display:block;margin:12px 0}textarea,input,select{font:inherit}nav{padding:12px;background:#dfebe3}button{font:inherit;margin:8px}#players{display:flex;gap:12px;flex-wrap:wrap}</style></head><body><main>
<h1>Continuity fixture laboratory</h1><p>Local deterministic fixtures. No external requests or real personal information.</p>
<nav><button id="route-a">Route A</button><button id="route-b">Route B</button><button id="replace">Replace player</button><button id="add-fields">Insert field</button></nav>
<div id="players"><audio id="audio-a" data-continuity-id="episode-a" controls preload="auto" src="/tone.wav"></audio><audio id="audio-b" data-continuity-id="episode-b" controls preload="auto" src="/tone.wav"></audio><video id="video-a" data-continuity-id="film-a" controls preload="auto" src="/sample.webm"></video></div>
<form id="reading-draft"><label>Reading notes <textarea id="notes"></textarea></label><label><input id="remember" type="checkbox">Remember this choice</label><fieldset><legend>Color preference</legend><label><input type="radio" name="color" value="green">Green</label><label><input type="radio" name="color" value="blue">Blue</label></fieldset><label>Theme <select id="theme"><option value="">Choose</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Website draft <textarea id="populated">Website supplied text</textarea></label><div id="late-field"></div><button type="submit">Submit (must never be automated)</button></form>
<form id="credential-fixture"><label>Password <input id="password" type="password"></label><label>One time code <input id="otp" autocomplete="one-time-code"></label><label>Payment card <input id="payment" autocomplete="cc-number"></label><label>Recovery phrase <textarea id="seed"></textarea></label><input type="hidden" id="hidden" value="hidden"></form>
<h2>Nested reading region</h2><div id="nested"><div id="nested-content"><h3 id="nested-start">Beginning</h3><p style="margin-top:1200px" id="nested-target">Nested target</p></div></div><div id="chapters"></div><div id="delayed"></div>
</main><script>
document.body.dataset.submitted='0';document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();document.body.dataset.submitted=String(Number(document.body.dataset.submitted)+1);}));
const chapters=document.getElementById('chapters');for(let i=0;i<16;i++){const s=document.createElement('section');s.className='chapter';s.id='chapter-'+i;const h=document.createElement('h2');h.textContent='Chapter '+(i+1);s.append(h);chapters.append(s);}
document.getElementById('route-a').onclick=()=>{history.pushState({},'', '/fixture?route=a#reading');document.getElementById('audio-a').setAttribute('data-continuity-id','episode-a');};
document.getElementById('route-b').onclick=()=>{history.pushState({},'', '/fixture?route=b#reading');const a=document.getElementById('audio-a');a.setAttribute('data-continuity-id','episode-new');a.currentTime=0;};
document.getElementById('replace').onclick=()=>{const old=document.getElementById('audio-a'),next=old.cloneNode(true);old.replaceWith(next);};
document.getElementById('add-fields').onclick=()=>{const t=document.createElement('textarea');t.id='late-notes';document.getElementById('late-field').replaceChildren(t);};
if(new URL(location.href).searchParams.has('delay')){const content=chapters.cloneNode(true);chapters.replaceChildren();setTimeout(()=>chapters.replaceChildren(...content.children),1200);}
</script></body></html>
